server {
    listen 80;
    listen [::]:80;
    server_name hpp.lrmobileid.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hpp.lrmobileid.com;

    ssl_certificate /etc/letsencrypt/live/hpp.lrmobileid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hpp.lrmobileid.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KULINERKIT_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log off;
    error_log /var/log/nginx/kulinerkit.error.log;
    client_max_body_size 10m;

    location / {
        add_header Cache-Control "no-store" always;
        return 503 "KulinerKit belum diaktifkan.\n";
    }
}
